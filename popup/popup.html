<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="popup-container">
      <!-- Header -->
      <header class="popup-header">
        <div class="logo-row">
          <svg
            class="logo-icon"
            width="32"
            height="24"
            viewBox="0 0 32 24"
            fill="none"
          >
            <rect x="0" y="0" width="32" height="24" rx="6" fill="#FF0000" />
            <polygon points="7,6 18,12 7,18" fill="#FFFFFF" />
            <polygon points="16,6 27,12 16,18" fill="#FFFFFF" />
          </svg>
          <h1 class="title">YouTube Fast</h1>
        </div>
        <p class="subtitle" id="status-text">Detecting video…</p>
      </header>

      <!-- Current Speed Display -->
      <div class="current-speed-display">
        <span class="current-label">Current Speed</span>
        <span class="current-value" id="current-speed">1×</span>
      </div>

      <!-- Speed Grid -->
      <div class="speed-grid" id="speed-grid">
        <!-- Buttons are injected by popup.js -->
      </div>

      <!-- Footer -->
      <!-- <footer class="popup-footer">
        <span class="hint">Speed persists across videos</span>
      </footer> -->
    </div>

    <script src="popup.js"></script>
  </body>
</html>
